<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Crear cuenta | Samira Lodi</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >


  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/login.css"
  >

</head>


<body>


<div id="header"></div>


<main class="login-page">


  <section class="login-section">


    <div class="login-box">


      <span class="subtitle">
        SAMIRA LODI
      </span>


      <h1>
        Crear cuenta.
      </h1>


      <p class="login-intro">
        Formá parte de la experiencia Samira Lodi
        y recibí novedades antes que nadie.
      </p>


      <form id="register-form">


        <div class="form-row">


          <div class="form-group">

            <label for="register-nombre">
              Nombre
            </label>

            <input
              type="text"
              id="register-nombre"
              placeholder="Tu nombre"
              required
            >

          </div>


          <div class="form-group">

            <label for="register-apellido">
              Apellido
            </label>

            <input
              type="text"
              id="register-apellido"
              placeholder="Tu apellido"
              required
            >

          </div>


        </div>


        <div class="form-group">

          <label for="register-email">
            Email
          </label>

          <input
            type="email"
            id="register-email"
            placeholder="Tu email"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="register-password">
            Contraseña
          </label>

          <input
            type="password"
            id="register-password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="register-password-confirm">
            Repetir contraseña
          </label>

          <input
            type="password"
            id="register-password-confirm"
            placeholder="Repetí tu contraseña"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          class="btn login-button"
        >
          Crear cuenta
        </button>


        <p
          id="register-message"
          class="form-message"
        ></p>


      </form>


      <div class="login-links">

        <a href="login.html">
          Ya tengo una cuenta
        </a>

      </div>


    </div>


  </section>


</main>


<div id="footer"></div>


<script src="js/header.js"></script>

<script src="js/footer.js"></script>

<script type="module" src="js/auth.js"></script>

<script src="js/main.js"></script>


</body>

</html>
