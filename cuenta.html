<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi cuenta | Samira Lodi</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/login.css"
  >

</head>


<body>


<div id="header"></div>


<main class="login-page">


  <section class="login-section">


    <div class="login-box">


      <span class="subtitle">
        MI CUENTA
      </span>


      <h1>
        Hola,
        <span class="user-name">
          bienvenida
        </span>.
      </h1>


      <p class="login-intro">

        Gracias por formar parte de
        Samira Lodi.

        <br><br>

        Desde aquí podrás acceder
        próximamente a novedades,
        lanzamientos y beneficios exclusivos.

      </p>


      <button
        class="btn login-button logout-btn"
      >
        Cerrar sesión
      </button>


    </div>


  </section>


</main>


<div id="footer"></div>


<script src="js/header.js"></script>

<script src="js/footer.js"></script>

<script type="module" src="js/auth.js"></script>

<script src="js/main.js"></script>
