<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Recuperar contraseña | Samira Lodi</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/login.css"
  >

</head>


<body>


<div id="header"></div>


<main class="login-page">


  <section class="login-section">


    <div class="login-box">


      <span class="subtitle">
        SAMIRA LODI
      </span>


      <h1>
        Recuperar acceso.
      </h1>


      <p class="login-intro">
        Ingresá tu email y te enviaremos
        las instrucciones para restablecer
        tu contraseña.
      </p>


      <form id="reset-form">


        <div class="form-group">

          <label for="reset-email">
            Email
          </label>

          <input
            type="email"
            id="reset-email"
            placeholder="Tu email"
            autocomplete="email"
            required
          >

        </div>


        <button
          type="submit"
          class="btn login-button"
        >
          Enviar instrucciones
        </button>


        <p
          id="reset-message"
          class="form-message"
        ></p>


      </form>


      <div class="login-links">

        <a href="login.html">
          Volver a iniciar sesión
        </a>

      </div>


    </div>


  </section>


</main>


<div id="footer"></div>


<script src="js/header.js"></script>

<script src="js/footer.js"></script>

<script type="module" src="js/auth.js"></script>

<script src="js/main.js"></script>


</body>

</html>
